[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends() in argument defaults is the idiomatic FastAPI pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# dev benchmark scripts embed long Arabic prompt/test strings
"scripts/*" = ["E501"]
